services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard
      POSTGRES_DB: opsboard
    ports:
      - "5432:5432"
    volumes:
      - opsboard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  opsboard_postgres:
