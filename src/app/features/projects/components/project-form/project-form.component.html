<form [formGroup]="form" (ngSubmit)="submit()"><div class="heading"><div><h2>Create project</h2><p>Add a new initiative to the workspace.</p></div><button type="button" class="close" (click)="cancelled.emit()">×</button></div><label>Project name<input formControlName="name" placeholder="e.g. Customer analytics"></label><label>Description<textarea formControlName="description" rows="3" placeholder="What are we trying to achieve?"></textarea></label><div class="row"><label>Status<select formControlName="status"><option value="PLANNING">Planning</option><option value="ACTIVE">Active</option><option value="ON_HOLD">On hold</option><option value="COMPLETED">Completed</option></select></label><label>Due date<input type="date" formControlName="dueDate"></label></div><label>Owner<select formControlName="ownerId"><option value="" disabled>Select team member</option>@for(user of users();track user.id){<option [value]="user.id">{{user.name}} · {{user.role}}</option>}</select></label><div class="actions"><button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button><button type="submit">Create project</button></div></form>
