<main class="auth"><section class="auth__brand"><div><span class="logo">O</span><h1>Run operations<br>with clarity.</h1><p>Projects, tasks and team momentum in one focused workspace.</p></div><small>OpsBoard · Operations Management Platform</small></section><section class="auth__form"><form [formGroup]="form" (ngSubmit)="submit()"><span class="mobile-logo">O</span><h2>Welcome back</h2><p>Sign in to continue to your workspace.</p><label>Email address<input type="email" formControlName="email" autocomplete="email">@if(form.controls.email.touched && form.controls.email.invalid){<small>Enter a valid email address.</small>}</label><label>Password<input type="password" formControlName="password" autocomplete="current-password">@if(form.controls.password.touched && form.controls.password.invalid){<small>Password must contain at least 8 characters.</small>}</label>@if(error()){<div class="error" role="alert">{{ error() }}</div>}<button type="submit" [disabled]="loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button><div class="demo"><strong>Demo access</strong><span>admin@opsboard.dev · OpsBoard123!</span></div></form></section></main>
