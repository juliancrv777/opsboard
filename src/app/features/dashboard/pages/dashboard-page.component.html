<main class="dashboard">
  <app-page-header title="Operations overview" description="A live snapshot of your team’s work and momentum." eyebrow="Dashboard"><button class="primary">+ New project</button></app-page-header>
  <section class="metrics" aria-label="Key metrics">@for (metric of metrics(); track metric.label) {<app-stat-card [label]="metric.label" [value]="metric.value" [trend]="metric.trend" />}</section>
  <section class="grid">
    <article class="panel"><div class="panel__header"><div><h2>Workload</h2><p>Tasks across the current cycle</p></div><span>Last 30 days</span></div><div class="chart" aria-label="Decorative workload chart"><i style="height:42%"></i><i style="height:62%"></i><i style="height:50%"></i><i style="height:78%"></i><i style="height:67%"></i><i style="height:88%"></i><i style="height:73%"></i></div></article>
    <article class="panel activity"><div class="panel__header"><div><h2>Recent activity</h2><p>Latest workspace changes</p></div></div>@for (item of activity(); track item.title) {<div class="activity__item"><span></span><div><strong>{{ item.title }}</strong><small>{{ item.meta }}</small></div></div>}</article>
  </section>
</main>
