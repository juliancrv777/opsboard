<form [formGroup]="form" (ngSubmit)="submit()"><div class="heading"><div><h2>Create task</h2><p>Define work, ownership and priority.</p></div><button type="button" class="close" (click)="cancelled.emit()">×</button></div><label>Task title<input formControlName="title" placeholder="What needs to be done?"></label><div class="row"><label>Project<select formControlName="projectId"><option value="" disabled>Select project</option>@for(project of projects();track project.id){<option [value]="project.id">{{project.name}}</option>}</select></label><label>Assignee<select formControlName="assigneeId"><option value="" disabled>Select team member</option>@for(user of users();track user.id){<option [value]="user.id">{{user.name}}</option>}</select></label></div><div class="row"><label>Status<select formControlName="status"><option value="TODO">To do</option><option value="IN_PROGRESS">In progress</option><option value="REVIEW">Review</option><option value="DONE">Done</option></select></label><label>Priority<select formControlName="priority"><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="URGENT">Urgent</option></select></label></div><label>Due date<input type="date" formControlName="dueDate"></label><div class="actions"><button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button><button type="submit">Create task</button></div></form>
