<main><app-page-header eyebrow="Workspace" title="Tasks" description="Coordinate execution across every active project."><button class="primary" (click)="modal.set(true)">+ New task</button></app-page-header><section class="toolbar"><input #q type="search" placeholder="Search tasks, projects or assignees…" (input)="store.setSearch(q.value)"><select #s (change)="status(s.value)"><option value="ALL">All statuses</option><option value="TODO">To do</option><option value="IN_PROGRESS">In progress</option><option value="REVIEW">Review</option><option value="DONE">Done</option></select><select #p (change)="priority(p.value)"><option value="ALL">All priorities</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="URGENT">Urgent</option></select></section><section class="table"><div class="thead"><span>Task</span><span>Project</span><span>Assignee</span><span>Status</span><span>Priority</span><span>Due</span><span></span></div>@for(task of store.filtered();track task.id){<article class="tr"><strong class="task-title">{{task.title}}</strong><span class="project"><small>Project</small>{{task.project}}</span><span class="assignee"><small>Assignee</small>{{task.assignee}}</span><span class="task-status"><small>Status</small><i class="status">{{task.status.replace('_',' ')}}</i></span><span class="task-priority"><small>Priority</small><i class="priority" [attr.data-priority]="task.priority">{{task.priority}}</i></span><span class="due"><small>Due</small>{{task.dueDate}}</span><button class="delete" aria-label="Delete task" (click)="store.remove(task.id)">×</button></article>}@empty{<div class="empty">No tasks match these filters.</div>}</section>@if(modal()){<div class="modal" (click)="modal.set(false)"><div (click)="$event.stopPropagation()"><app-task-form [users]="users()" [projects]="projects()" (submitted)="create($event)" (cancelled)="modal.set(false)"/></div></div>}</main>
